<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Para Amigo 30 — RivasFolio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <main class="card">
    <p class="eyebrow">Un audio para ti</p>
    <h1 class="name">Chikiveivi</h1>
    <p class="subtitle">Presiona play cuando estés listo(a) para escucharlo.</p>

    <div class="disc-wrap">
      <div class="disc" id="disc">
        <div class="disc-label">
          <button class="play-btn" id="playBtn" aria-label="Reproducir">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M7 5.5v13c0 .8.87 1.3 1.55.87l10.5-6.5a1 1 0 0 0 0-1.7l-10.5-6.5C7.87 4.2 7 4.7 7 5.5Z"/>
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="progress-row">
      <span class="time" id="currentTime">0:00</span>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-knob" id="progressKnob"></div>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Buscar en el audio" />
      </div>
      <span class="time time-end" id="duration">0:00</span>
    </div>

    <p class="message" hidden></p>

    <audio id="audio" src="https://res.cloudinary.com/dh9rltust/video/upload/v1787931089/Chikiveivi_u35fdz.m4a" preload="metadata"></audio>

    <p class="footer">De parte de Rivas</p>
  </main>

  <script src="../assets/script.js"></script>
</body>
</html>
